<ion-card>
  <swiper-container>
    <swiper-slide *ngFor="let media of post?.media">
      <img alt="Silhouette of mountains" [src]="media.url" />
    </swiper-slide>
  </swiper-container>
  <ion-card-header>
    <ion-card-title>{{post?.title}}</ion-card-title>
    <ion-card-subtitle>{{post?.like}} Likes</ion-card-subtitle>
  </ion-card-header>
    <ion-grid>
      <ion-row>
        <ion-col>{{post?.description}}</ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="8">
          <ion-button color="light" class="post-button" size="small" (click)="likePost()"><ion-icon [ngClass]="post?.userLiked ? 'liked-button':''" [name]="post?.userLiked ? 'heart' :'heart-outline'" size="small"></ion-icon></ion-button>
          <ion-button color="light" class="post-button" size="small" (click)="commentOnPost()"><ion-icon name="chatbubbles"size="small"></ion-icon></ion-button>
          <ion-button color="light" class="post-button" size="small" (click)="sharePost()"><ion-icon name="share" size="small"></ion-icon></ion-button>
        </ion-col>
      </ion-row>
      <ion-row *ngIf="showComments">
        <ion-col size="12">
          <app-comments-card [post]="post"></app-comments-card>
        </ion-col>
     </ion-row>
    </ion-grid>
</ion-card>
