<ion-card>
  <ion-card-header>
    <ion-card-title>Card Title</ion-card-title>
    <ion-card-subtitle>Card Subtitle</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <ion-list>
     <ion-item *ngFor="let comment of comments | async; trackBy: commentTrackByFn" lines="none">
        <ion-thumbnail slot="start">
          <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
        </ion-thumbnail>
        <ion-label>{{comment.title}}</ion-label>
      </ion-item>
    </ion-list>
  </ion-card-content>
</ion-card>
